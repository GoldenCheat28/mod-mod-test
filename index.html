<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#141414">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Ore Upgrader</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <header id="topbar">
    <button id="fullscreenBtn" title="На весь экран">⛶</button>
    <div id="balanceLine">Инвентарь: <span id="totalValue">0</span> ⛃</div>
    <button id="claimBtn" disabled>Медь: --:--</button>
  </header>

  <nav id="tabBar">
    <button class="tab-btn active" data-tab="upgrader">Апгрейдер</button>
    <button class="tab-btn" data-tab="cases">Кейсы</button>
    <button class="tab-btn" data-tab="daily">Колесо удачи</button>
  </nav>

  <main>
    <section id="inventoryPanel">
      <h2>Инвентарь</h2>
      <div id="inventoryGrid"></div>
    </section>

    <section id="dailyPanel" class="tab-page hidden">
      <h2>Колесо удачи</h2>
      <div id="dailyWheelWrap">
        <div id="dailyWheelDisc"></div>
        <div id="dailyNeedle"><div id="dailyNeedleTip"></div></div>
      </div>
      <button id="dailySpinBtn" disabled>Крутить</button>
    </section>

    <section id="upgraderPanel" class="tab-page">
      <h2>Апгрейдер</h2>

      <div class="upgrade-row">
        <div class="upgrade-slot" id="stakeSlot">
          <span class="slot-label">Ставка (перетащи сюда)</span>
          <div class="slot-content" id="stakeContent">
            <span class="slot-empty">перетащи предметы →</span>
          </div>
          <div class="slot-value" id="stakeValueLabel">0 ⛃</div>
        </div>

        <div class="upgrade-arrow">→</div>

        <div class="upgrade-slot" id="targetSlot">
          <span class="slot-label">Цель (перетащи сюда)</span>
          <div class="slot-content" id="targetContent">
            <span class="slot-empty">перетащи цель →</span>
          </div>
          <div class="slot-value" id="targetValueLabel">0 ⛃</div>
          <div class="qty-stepper" id="targetQtyStepper">
            <button id="qtyMinus" type="button">−</button>
            <span id="qtyValue">x1</span>
            <button id="qtyPlus" type="button">+</button>
          </div>
        </div>
      </div>

      <div id="wheelWrap">
        <svg id="wheelSvg" viewBox="0 0 200 200">
          <circle class="wheel-ring-bg" cx="100" cy="100" r="88"></circle>
          <circle id="wheelRed" class="wheel-ring" cx="100" cy="100" r="88"></circle>
          <circle id="wheelGreen" class="wheel-ring" cx="100" cy="100" r="88"></circle>
          <circle class="wheel-hub" cx="100" cy="100" r="62"></circle>
        </svg>
        <div id="needle"><div id="needleTip"></div></div>
      </div>

      <button id="upgradeBtn" disabled>УЛУЧШИТЬ</button>

      <div id="targetCatalog"></div>
    </section>

    <section id="casesPanel" class="tab-page hidden">
      <h2>Кейсы</h2>
      <div id="casesGrid"></div>
    </section>
  </main>

  <div id="resultOverlay" class="hidden">
    <div id="resultCard">
      <div id="resultTitle"></div>
      <div id="resultItem"></div>
      <button id="resultClose">ОК</button>
    </div>
  </div>

  <div id="caseRevealOverlay" class="hidden">
    <div id="caseRevealCard">
      <div id="caseRevealTitle"></div>
      <div id="reelViewport">
        <div id="reelTrack"></div>
        <div id="reelMarker"></div>
      </div>
      <button id="caseRevealClose" disabled>Открываю...</button>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script src="items.js"></script>
<script src="cases.js"></script>
<script src="daily.js"></script>
<script src="app.js"></script>
</body>
</html>
